name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        # Windows 是首要部署平台，三平台必须全绿（路径分隔符差异实测）
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets

  release-build:
    if: github.ref == 'refs/heads/main'
    needs: [lint, test]
    strategy:
      matrix:
        target: [x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu]
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - run: cargo build --release --target ${{ matrix.target }}
      - name: 校验产物体积（无 strip 不应超过 15MB）
        shell: bash
        run: |
          f="target/${{ matrix.target }}/release/so-novel-rs"
          [ -f "$f.exe" ] && f="$f.exe"
          size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
          echo "产物体积: ${size} bytes"
          if [ "$size" -gt 15728640 ]; then
            echo "ERROR: 产物超过 15MB 体积预算" >&2; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sonovel-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/so-novel-rs*
